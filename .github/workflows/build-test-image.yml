name: Build test image

# Builds and publishes a throwaway Docker image for manual testing on a
# resource-constrained host (a NAS build failed on OOM - GitHub's runners
# have plenty of RAM/CPU to spare). Not part of the release pipeline.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/newer-version-update-button

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:test
            ghcr.io/${{ github.repository }}:test-${{ github.sha }}
